<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad_oneplus-nord-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screenGrad_oneplus-nord-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow_oneplus-nord-4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Phone Body Outer Shadow & Frame -->
  <rect x="42" y="22" width="236" height="436" rx="42" fill="url(#metalRim)" filter="url(#shadow_oneplus-nord-4)"/>
  <rect x="45" y="25" width="230" height="430" rx="39" fill="url(#bodyGrad_oneplus-nord-4)"/>

  <!-- Screen Bezel -->
  <rect x="52" y="32" width="216" height="416" rx="33" fill="#000000"/>
  <!-- Screen OLED Display Area -->
  <rect x="54" y="34" width="212" height="412" rx="31" fill="url(#screenGrad_oneplus-nord-4)" opacity="0.92"/>

  <!-- Subtle Wallpaper Wave Elements -->
  <circle cx="160" cy="180" r="110" fill="#475569" opacity="0.25" filter="blur(20px)"/>
  <circle cx="210" cy="320" r="90" fill="#38bdf8" opacity="0.22" filter="blur(25px)"/>

  <!-- Dynamic Island / Punch Hole / Camera Island -->
  <rect x="130" y="44" width="60" height="15" rx="7.5" fill="#000000"/>
  <circle cx="178" cy="51.5" r="3.5" fill="#1e293b"/>
  <circle cx="179" cy="51" r="1.2" fill="#38bdf8"/>

  <!-- Modern Lockscreen / UI Minimal Overlay -->
  <text x="160" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">12:45</text>
  <text x="160" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="1">5G • %100 DOLU</text>

  <!-- Brand & Model Watermark in Screen Center -->
  <rect x="76" y="215" width="168" height="64" rx="14" fill="#0f172a" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="160" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">ONEPLUS</text>
  <text x="160" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">OnePlus Nord 4</text>

  <!-- Bottom Home Indicator Bar -->
  <rect x="120" y="434" width="80" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
</svg>